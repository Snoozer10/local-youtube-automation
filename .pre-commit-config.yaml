repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.1
    hooks:
      - id: mypy
        files: ^src/
        additional_dependencies:
          - pydantic>=2.0.0
          - playwright>=1.40.0
          - types-requests
          - types-urllib3
          - types-tqdm
          - types-Pillow
          - typing-extensions>=4.12.0
        args: [--strict, --ignore-missing-imports]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(evidence/receipts/|tests/fixtures/semantic_failures/|docs/error-solving/understood-errors\.md)
      - id: end-of-file-fixer
        exclude: ^(evidence/receipts/|tests/fixtures/semantic_failures/|docs/error-solving/understood-errors\.md)
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: debug-statements
      - id: detect-private-key
      - id: detect-aws-credentials
        args: [--allow-missing-credentials]
      - id: forbid-new-submodules

  - repo: local
    hooks:
      - id: check-secrets
        name: check secrets and service tokens
        entry: python tools/check_secrets.py --
        language: system
        pass_filenames: true
      - id: pytest-unit
        name: pytest (unit tests only)
        entry: python -m pytest
        args: ["tests/unit", "-c", "pyproject.toml", "-m", "not live_browser", "-v", "--tb=short"]
        language: system
        types: [python]
        pass_filenames: false
        always_run: true

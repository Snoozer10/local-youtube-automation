name: "Release"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Build Wheel and Source Distribution
        run: |
          python -m pip install --upgrade pip build wheel
          python -m build --sdist --wheel --outdir dist/

      - name: Assemble standalone portable Windows zip bundle
        shell: pwsh
        run: |
          $ref = "${{ github.ref_name }}"
          $archiveName = "youtube-automation-pipeline-$ref-windows-x64.zip"
          $distDir = "dist"
          $archivePath = Join-Path $distDir $archiveName
          $runnerTemp = [IO.Path]::GetFullPath($env:RUNNER_TEMP)
          $stagingDir = Join-Path $runnerTemp "bundle_staging"
          $resolvedStagingDir = [IO.Path]::GetFullPath($stagingDir)
          if ([IO.Path]::GetDirectoryName($resolvedStagingDir).TrimEnd('\') -ne $runnerTemp.TrimEnd('\') -or [IO.Path]::GetFileName($resolvedStagingDir) -ne "bundle_staging") { throw "Refusing to use a staging path outside RUNNER_TEMP." }

          if (Test-Path $stagingDir) { Remove-Item -Recurse -Force $stagingDir }
          New-Item -ItemType Directory -Path $stagingDir -Force | Out-Null

          # Copy root python modules
          Get-ChildItem -Path *.py -File | ForEach-Object {
              Copy-Item -Path $_.FullName -Destination $stagingDir
          }

          # Copy tools directory
          if (Test-Path "tools") {
              Copy-Item -Path "tools" -Destination $stagingDir -Recurse
          }

          # Copy the importable runtime package while preserving its src/ layout
          New-Item -ItemType Directory -Path (Join-Path $stagingDir "src") -Force | Out-Null
          Copy-Item -Path "src/youtube_automation" -Destination (Join-Path $stagingDir "src") -Recurse -Force

          # Copy all prompt templates recursively, including fragments and turns
          Copy-Item -Path "prompts" -Destination $stagingDir -Recurse -Force

          # Copy saved channel profiles only
          $channelFiles = @(Get-ChildItem -Path "channels" -Filter "*.json" -File)
          if ($channelFiles.Count -lt 3) { throw "Expected at least three saved channel JSON profiles; found $($channelFiles.Count)." }
          $channelsStage = Join-Path $stagingDir "channels"
          New-Item -ItemType Directory -Path $channelsStage -Force | Out-Null
          Copy-Item -Path $channelFiles.FullName -Destination $channelsStage -Force

          # Copy configuration files, setup/runner scripts, documentation, and dependencies
          $requiredFiles = @(
              "daheeh_config.json",
              "video_config.txt",
              "transcribe_config.txt",
              ".env.example",
              "setup.bat",
              "setup.ps1",
              "run.bat",
              "README.md",
              "LICENSE",
              "CHANGELOG.md",
              "requirements.txt",
              "requirements-dev.txt",
              "pyproject.toml"
          )

          foreach ($f in $requiredFiles) {
              if (Test-Path $f) {
                  Copy-Item -Path $f -Destination $stagingDir
              }
          }

          # Strip any __pycache__ or .pyc from staging
          Get-ChildItem -Path $stagingDir -Recurse -Include "__pycache__", "*.pyc" | Remove-Item -Recurse -Force

          # Ensure dist directory exists
          if (-not (Test-Path $distDir)) {
              New-Item -ItemType Directory -Path $distDir -Force | Out-Null
          }

          # Create zip archive
          Compress-Archive -Path "$stagingDir\*" -DestinationPath $archivePath -Force

          # Verify every runtime package, prompt, and saved profile file is in the ZIP
          $repoRoot = (Resolve-Path ".").Path
          $packageFiles = @(Get-ChildItem -Path "src/youtube_automation" -Recurse -File | Where-Object { $_.Extension -ne ".pyc" -and $_.FullName -notmatch '[/\\]__pycache__[/\\]' })
          $promptFiles = @(Get-ChildItem -Path "prompts" -Recurse -File)
          if ($packageFiles.Count -eq 0 -or $promptFiles.Count -eq 0) { throw "Runtime package or prompt templates are missing from the source checkout." }
          $requiredZipPaths = @($packageFiles + $promptFiles + $channelFiles | ForEach-Object { [IO.Path]::GetRelativePath($repoRoot, $_.FullName).Replace("\", "/") })
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $archivePath).Path)
          try {
              $entryNames = @($zip.Entries | ForEach-Object { $_.FullName.Replace("\", "/") })
              $missingEntries = @($requiredZipPaths | Where-Object { $entryNames -notcontains $_ })
              if ($missingEntries.Count -gt 0) { throw "Portable ZIP is missing required entries: $($missingEntries -join ', ')" }
          } finally {
              $zip.Dispose()
          }
          Write-Host "[SUCCESS] ZIP contains $($requiredZipPaths.Count) runtime package, prompt, and saved profile files."
          Write-Host "[SUCCESS] Assembled portable bundle: $archivePath"
          Remove-Item -Recurse -Force $stagingDir

      - name: Generate SHA256SUMS.txt
        shell: pwsh
        run: |
          $distFiles = Get-ChildItem -Path dist/* -File | Where-Object { $_.Name -ne "SHA256SUMS.txt" }
          $lines = foreach ($file in $distFiles) {
              $hash = (Get-FileHash -Path $file.FullName -Algorithm SHA256).Hash.ToLower()
              "$hash  $($file.Name)"
          }
          $lines | Set-Content -Path "dist/SHA256SUMS.txt" -Encoding ascii
          Get-Content "dist/SHA256SUMS.txt"

      - name: Extract release notes
        run: python tools/extract_release_notes.py ${{ github.ref_name }} --output release_notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          body_path: release_notes.md
          files: dist/*
          draft: false
          prerelease: false

name: "CI"

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies
        run: |
          choco install ffmpeg audacity -y --no-progress
          # Note: Audacity mod-script-pipe requires manual enable in CI
        shell: pwsh

      - name: Upgrade pip, setuptools, wheel
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install production dependencies
        run: pip install -r requirements.txt

      - name: Install development/test dependencies
        run: |
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps

      - name: Quality gate (linting)
        run: ruff check tests/unit

      - name: Run unit tests
        run: python -m pytest tests/unit -v --cov=. --cov-report=xml
name: Documentation

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  onboarding:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.11"
      - name: Check public onboarding
        run: python tools/check_readme.py
      - name: Test documentation checker
        run: python -m unittest discover -s tests/unit -p test_readme_contract.py -v
